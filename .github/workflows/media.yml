name: 노출 현황 다시 암호화

# 수집 없이 노출 현황 암호화 파일(media/media.enc.json)만 다시 만든다.
# 비밀번호(Secret DASH_PASSWORDS)를 바꾸거나 지웠을 때 실행하면, 다음 대시보드 갱신부터
# 새 비밀번호로만 열린다.
on:
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0
      - name: 만들고 저장
        env:
          DASH_PASSWORDS: ${{ secrets.DASH_PASSWORDS }}
        run: |
          if [ -z "$DASH_PASSWORDS" ]; then echo "::error::Secret DASH_PASSWORDS가 없습니다."; exit 1; fi
          python build_media.py
          python encrypt_media.py
          git config user.name "campus-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media
          git commit -qm "노출 현황 암호화 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push || (git pull --rebase -q -X theirs && git push)
