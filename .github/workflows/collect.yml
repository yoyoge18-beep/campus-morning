name: 대학 조간 수집

# 자동 예약 없음: 매일 09:00 Claude 발행 작업이 이 워크플로를 직접 실행한다.
# 수집 범위는 실행 시각과 관계없이 전날 09:00 ~ 당일 09:00 (collect.py).
on:
  workflow_dispatch: {}     # 실행 버튼 (발행 작업·수동 공용)

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0
      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python collect.py
      - name: 저장
        run: |
          git config user.name "campus-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "수집 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push
