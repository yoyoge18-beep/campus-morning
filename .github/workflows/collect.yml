name: 대학 조간 수집

# 자동 예약 없음: 매일 09:00 Claude 발행 작업이 이 워크플로를 직접 실행한다.
# 수집 범위는 실행 시각과 관계없이 전날 09:00 ~ 당일 09:00 (collect.py).
# 월요일에는 경남정보대 기사만 금요일 09:00 ~ 월요일 09:00.
on:
  workflow_dispatch:        # 실행 버튼 (발행 작업·수동 공용)
    inputs:
      backfill:
        description: "지난 관리 언론사 경남정보대 기사 채우기(한 번만)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0
      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python collect.py
      - name: 지난 기사 채우기
        if: ${{ inputs.backfill }}
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python kit_backfill.py
      - name: 저장
        run: |
          git config user.name "campus-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -qm "수집 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git pull --rebase -q
          # 노출 현황 자료는 최신 자료를 받은 뒤 다시 만든다(동시 저장 충돌 방지)
          python build_media.py
          git add media
          git commit -qm "노출 현황 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push || (git pull --rebase -q -X theirs && git push)
