name: 언론사 배너 점검

# 자동 예약 없음: 매일 09:00 Claude 발행 작업이 수집(collect.yml) 뒤에 이 워크플로를 직접 실행한다.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "시험 모드(전체 화면 캡처 + 언론사 도메인 조사)"
        type: boolean
        default: false
      only:
        description: "특정 언론사만(쉼표 구분, 비우면 전체)"
        type: string
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  adcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 requests==2.32.3 cryptography==44.0.0 && python -m playwright install --with-deps chromium
      - name: 언론사 도메인 조사 (시험 모드)
        if: ${{ inputs.probe }}
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python domain_survey.py
      - name: 배너 점검
        timeout-minutes: 30
        env:
          AD_FULLSHOT: ${{ inputs.probe && '1' || '0' }}
          AD_ONLY: ${{ inputs.only }}
        run: python ad_check.py
      - name: 화면 캡처를 probe-shots 브랜치에 올리기 (시험 모드)
        if: ${{ always() && inputs.probe }}
        run: |
          mkdir -p /tmp/shots && cp -r probe_shots/. /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q -b probe-shots && git config user.name "campus-morning-bot" \
            && git config user.email "actions@users.noreply.github.com" && git add -A && git commit -qm "시험 캡처 $(TZ=Asia/Seoul date +%F)" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-shots
      - name: 저장
        env:
          DASH_PASSWORDS: ${{ secrets.DASH_PASSWORDS }}
        if: ${{ always() }}
        run: |
          git config user.name "campus-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -qm "배너 점검 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git pull --rebase -q
          # 노출 현황 자료는 최신 자료를 받은 뒤 다시 만든다(동시 저장 충돌 방지)
          python build_media.py
          python encrypt_media.py
          git add media
          git commit -qm "노출 현황 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push || (git pull --rebase -q -X theirs && git push)
