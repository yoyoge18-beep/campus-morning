<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>대학 조간</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Pretendard";src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
/* Layout: 흰 로고 띠 → 반투명 메뉴 띠(고정) → 연회색(parchment) 바탕 위 흰 카드, 단일 칼럼 max 760px.
   DESIGN-apple.md 기준: 강조색은 Action Blue 하나, 그림자 없음, 굵기 400/600, 본문 17px·1.47, 제목은 음수 자간 */
:root{
  --canvas:#FFFFFF; --parchment:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink-80:#333333; --muted:#6E6E73;
  --hairline:#E0E0E0; --primary:#0066CC; --focus:#0071E3; --chip-sel:#1D1D1F; --on-chip-sel:#FFFFFF;
  --frost:rgba(245,245,247,.8); --kit:#C8183A;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#000000; --parchment:#000000; --card:#1D1D1F; --ink:#F5F5F7; --ink-80:#CCCCCC; --muted:#98989D;
  --hairline:#38383A; --primary:#2997FF; --focus:#2997FF; --chip-sel:#F5F5F7; --on-chip-sel:#1D1D1F;
  --frost:rgba(22,22,23,.8); --kit:#FF4D6A; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#000000; --parchment:#000000; --card:#1D1D1F; --ink:#F5F5F7; --ink-80:#CCCCCC; --muted:#98989D;
  --hairline:#38383A; --primary:#2997FF; --focus:#2997FF; --chip-sel:#F5F5F7; --on-chip-sel:#1D1D1F;
  --frost:rgba(22,22,23,.8); --kit:#FF4D6A; color-scheme:dark}
body{background:var(--parchment);color:var(--ink);font-family:var(--f-text);font-size:17px;line-height:1.47;letter-spacing:-.374px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit}
button:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* 상단: 로고 띠 + 메뉴 띠 */
.site-top{background:var(--canvas)}
.brand{display:flex;justify-content:center;padding-block:20px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand a{display:inline-flex}
.brand img{display:block;width:220px;max-width:62vw;height:auto}
.brand .logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .logo-l{display:none}:root:not([data-theme="light"]) .brand .logo-d{display:block}}
:root[data-theme="dark"] .brand .logo-l{display:none}
:root[data-theme="dark"] .brand .logo-d{display:block}
.gnb{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--frost);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hairline);display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gnb ul{list-style:none;margin:0;padding:0;display:flex;gap:28px;width:100%;max-width:760px;height:52px;align-items:stretch}
.gnb li{display:flex}
.gnb a{display:flex;align-items:center;font-size:14px;letter-spacing:-.224px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.gnb a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.gnb a:hover{color:var(--ink)}
.gnb .ext{font-size:12px;margin-left:3px}

/* 본문 */
.wrap{max-width:760px;margin:0 auto;padding-block:48px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:24px}
header.mast{display:flex;flex-direction:column;gap:8px}
.mast h1{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.6px;margin:0}
.mast .sub{color:var(--muted);font-size:17px}
.stamp{color:var(--muted);font-size:14px;letter-spacing:-.224px;font-variant-numeric:tabular-nums}

/* 날짜·분야 알약 */
nav.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
nav.days::-webkit-scrollbar{display:none}
nav.days button,.chip{flex:0 0 auto;font-size:14px;letter-spacing:-.224px;color:var(--ink);background:var(--card);border:1px solid var(--hairline);border-radius:9999px;padding:8px 16px;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .1s}
nav.days button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--chip-sel);border-color:var(--chip-sel);color:var(--on-chip-sel);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* 오늘판 머리 */
.edition-head{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.meta{font-size:14px;letter-spacing:-.224px;color:var(--muted);font-variant-numeric:tabular-nums}
.edition-head h2{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.18;letter-spacing:-.6px;margin:0;text-wrap:balance}
.edition-head p{margin:0;color:var(--ink-80);font-size:17px;max-width:62ch}

/* 분야별 기사 */
section.cat{display:flex;flex-direction:column;gap:12px;margin-top:32px!important}
section.cat h3{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:.231px;line-height:1.19;color:var(--ink);margin:0 0 4px}
section.cat.pri h3{color:var(--kit)}
article{background:var(--card);border:1px solid var(--hairline);border-radius:18px;padding:20px 24px;display:flex;flex-direction:column;gap:6px;min-width:0}
article > a{color:var(--ink);text-decoration:none;font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.374px}
article > a:hover{color:var(--primary)}
article p{margin:0;color:var(--ink-80);font-size:15px;line-height:1.47;letter-spacing:-.24px}
article .src{font-size:12px;letter-spacing:-.12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
article .also{font-size:12px;letter-spacing:-.12px;color:var(--muted)}
article .also a{color:var(--primary);text-decoration:none}
article .also a:hover{text-decoration:underline}
.empty{background:var(--card);border:1px solid var(--hairline);border-radius:18px;padding:32px 24px;color:var(--muted);text-align:center}
footer{color:var(--muted);font-size:12px;line-height:1.6;letter-spacing:-.12px;border-top:1px solid var(--hairline);padding-top:20px;margin-top:24px}

@media (max-width:640px){
  .wrap{padding-block:32px 48px}
  .mast h1{font-size:34px}
  .edition-head h2{font-size:26px}
  article{padding:18px 20px}
}
@media (max-width:419px){.mast h1{font-size:28px}.edition-head h2{font-size:22px}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}*{transition:none!important}}
</style>

<div class="site-top">
  <header class="brand">
    <a href="https://www.kit.ac.kr/" target="_blank" rel="noopener" aria-label="경남정보대학교 홈페이지"><img class="logo-l" src="logo.png" alt="경남정보대학교" width="260" height="42"><img class="logo-d" src="logo-dark.png" alt="경남정보대학교" width="260" height="42"></a>
  </header>
  <nav class="gnb" aria-label="메뉴">
    <ul>
      <li><a href="#" aria-current="page">대학 조간</a></li>
      <li><a href="https://claude.ai/artifact/HFMBwgnSFzoinJzxCVGmzK" target="_blank" rel="noopener">언론사 노출 현황<span class="ext" aria-hidden="true">↗</span></a></li>
    </ul>
  </nav>
</div>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>대학 조간</h1>
      <div class="sub">경남정보대 · 부산 대학 우선, 매일 아침 한 번에</div>
    </div>
    <span class="stamp">매일 09:00 KST 발행</span>
  </header>

  <nav class="days" id="days" aria-label="발행일"></nav>

  <main id="main">
    <div class="empty" id="empty">오늘판을 불러오는 중입니다. 첫 발행분은 매일 오전 9시 전에 채워집니다.</div>
  </main>

  <footer>기사 제목을 누르면 원문이 새 탭에서 열립니다. 요약은 원문을 바탕으로 짧게 다시 쓴 것입니다.<br>싣는 언론사(순위순): 부산일보·국제신문·KNN / 한국대학신문·조선일보·중앙일보·동아일보·연합뉴스·한겨레·경향신문·한국일보 / 아시아경제·아주경제</footer>
</div>

<script>
const CATS=["경남정보대","부산 대학","정책·국감","입시","연구·성과","대학 소식","산학·지역"];
let editions=[], current=null, filter="전체";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDay=d=>{const [y,m,dd]=d.split("-");const w="일월화수목금토"[new Date(+y,+m-1,+dd).getDay()];return `${+m}.${+dd} (${w})`;};

let renderDays=function(){
  const nav=$("#days");
  nav.innerHTML=editions.map(e=>`<button type="button" data-d="${esc(e.id)}" aria-pressed="${e.id===current}">${fmtDay(e.id)}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=b.dataset.d;filter="전체";render();});
}
function render(){
  renderDays();
  const main=$("#main");
  const e=editions.find(x=>x.id===current);
  if(!e){main.innerHTML=`<div class="empty">아직 발행된 판이 없습니다. 매일 오전 9시 전에 새 판이 올라옵니다.</div>`;return;}
  const edMD=e.id.slice(5).replace("-",".");
  const key=i=>{const d=String(i.date||edMD).replace(/[^0-9.]/g,"");const [m,dd]=d.split(".").map(Number);
    let mm=m||0; if(mm>+e.id.slice(5,7)) mm-=12; return mm*100+(dd||0);};
  const items=(Array.isArray(e.items)?e.items:[]).map((i,n)=>({...i,_n:n})).sort((a,b)=>(a.tier||9)-(b.tier||9)||key(b)-key(a)||a._n-b._n);
  const present=CATS.filter(c=>items.some(i=>i.category===c));
  const others=[...new Set(items.map(i=>i.category).filter(c=>!CATS.includes(c)))];
  const cats=[...present,...others];
  const shown=filter==="전체"?cats:cats.filter(c=>c===filter);
  main.innerHTML=`
    <div class="edition-head">
      <span class="meta">${esc(e.id)} · 기사 ${items.length}건</span>
      <h2>${esc(e.headline||fmtDay(e.id)+" 대학가 소식")}</h2>
      ${e.brief?`<p>${esc(e.brief)}</p>`:""}
      <div class="tools" role="group" aria-label="분야">
        ${["전체",...cats].map(c=>`<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${c===filter}">${esc(c)}</button>`).join("")}
      </div>
    </div>
    ${shown.map(c=>`
      <section class="cat${c==="경남정보대"?" pri":""}" style="margin-top:22px">
        <h3>${esc(c)}</h3>
        ${items.filter(i=>i.category===c).map(i=>`
          <article>
            <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
            ${i.summary?`<p>${esc(i.summary)}</p>`:""}
            <span class="src">${esc([i.source,i.date].filter(Boolean).join(" · "))}</span>
            ${Array.isArray(i.also)&&i.also.length?`<span class="also">같은 소식 ${i.also.length}곳: ${i.also.map(a=>a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a>`:esc(a.source)).join(", ")}</span>`:""}
          </article>`).join("")}
      </section>`).join("")}`;
  main.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.c;render();});
}

// 기사 데이터: 페이지와 함께 발행되는 editions/index.json + editions/YYYY-MM.json (로그인 없이 열람)
let months=[], loaded=new Set();
async function getJSON(p){const r=await fetch(p+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json();}
async function loadMonth(m){
  if(loaded.has(m))return;
  const d=await getJSON("editions/"+m+".json");
  loaded.add(m);
  const map=new Map(editions.map(e=>[e.id,e]));
  (d.editions||[]).forEach(e=>map.set(e.id,e));
  editions=[...map.values()].sort((a,b)=>b.id.localeCompare(a.id));
}
const _renderDays=renderDays;
renderDays=function(){
  _renderDays();
  const older=months.find(m=>!loaded.has(m));
  if(older){
    const b=document.createElement("button");b.type="button";b.textContent="지난달 보기";
    b.onclick=async()=>{b.disabled=true;try{await loadMonth(older);}catch(e){} render();};
    $("#days").appendChild(b);
  }
};
(async()=>{
  try{
    const idx=await getJSON("editions/index.json");
    months=(idx.months||[]).slice().sort().reverse();
    if(months[0]) await loadMonth(months[0]);
    current=editions[0]?.id||null;
    render();
  }catch(e){$("#empty").textContent="기사를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.";}
})();
</script>

</body></html>
